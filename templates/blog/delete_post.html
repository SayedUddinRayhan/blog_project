{% extends 'base.html' %}

{% block content %}
<h2>Are you sure you want to delete "{{ post.title }}"?</h2>

<form method="POST">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
